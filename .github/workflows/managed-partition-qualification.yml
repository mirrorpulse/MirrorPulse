name: Managed test partition qualification

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/managed-partition-qualification.yml'
      - 'eng/collect-managed-test-originals.ps1'
      - 'eng/test-managed-partition.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Compile and record the complete managed test inventory
        shell: pwsh
        run: |
          ./eng/restore-adapter-sdk.ps1
          dotnet restore MirrorPulse.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet build MirrorPulse.sln --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
          ./eng/collect-managed-test-originals.ps1 -Phase Prepare -Partitioned
          ./eng/collect-compiled-test-inventory.ps1 -Phase Discover
      - name: Archive the common Release build
        shell: pwsh
        run: |
          $paths = @(git ls-files '*.csproj' | ForEach-Object {
            $bin = (Split-Path -Parent $_) + '/bin/Release'
            if (Test-Path -LiteralPath $bin) { $bin }
          })
          if ($LASTEXITCODE -ne 0 -or $paths.Count -eq 0) { throw 'Release output directories are missing.' }
          $paths += 'artifacts/test-results/managed-originals'
          tar.exe -cf artifacts/managed-build.tar @paths
          if ($LASTEXITCODE -ne 0) { throw 'Archiving the Release build failed.' }
          (Get-FileHash -LiteralPath artifacts/managed-build.tar).Hash | Set-Content -LiteralPath artifacts/managed-build.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: managed-release-build
          path: |
            artifacts/managed-build.tar
            artifacts/managed-build.sha256
          if-no-files-found: error
          retention-days: 3

  test:
    name: Managed tests (${{ matrix.partition }})
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        partition: [CatalogA, CatalogB, Core, Clients]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: managed-release-build
          path: artifacts
      - name: Execute the assigned cases
        shell: pwsh
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          if ((Get-FileHash -LiteralPath artifacts/managed-build.tar).Hash -cne (Get-Content -LiteralPath artifacts/managed-build.sha256)) {
            throw 'The shared Release build changed in transit.'
          }
          tar.exe -xf artifacts/managed-build.tar
          if ($LASTEXITCODE -ne 0) { throw 'Extracting the shared Release build failed.' }
          ./eng/test-managed-partition.ps1 -Partition $env:PARTITION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: managed-results-${{ matrix.partition }}
          path: artifacts/test-results/managed/${{ matrix.partition }}/**
          if-no-files-found: error

  reconcile:
    needs: [prepare, test]
    if: always() && needs.prepare.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: managed-release-build
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: managed-results-*
          path: artifacts/test-results/managed
      - name: Verify every original managed result
        shell: pwsh
        env:
          PARTITIONS_RESULT: ${{ needs.test.result }}
        run: |
          if ((Get-FileHash -LiteralPath artifacts/managed-build.tar).Hash -cne (Get-Content -LiteralPath artifacts/managed-build.sha256)) {
            throw 'The shared Release build changed in transit.'
          }
          tar.exe -xf artifacts/managed-build.tar
          if ($LASTEXITCODE -ne 0) { throw 'Extracting the shared Release build failed.' }
          ./eng/collect-managed-test-originals.ps1 -Phase Collect -Partitioned
          ./eng/collect-compiled-test-inventory.ps1 -Phase Reconcile
          ./eng/verify-test-results.ps1 -Suite managed -ResultsDirectory artifacts/test-results/managed
          if ($env:PARTITIONS_RESULT -cne 'success') { throw 'A managed test partition did not complete successfully.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: managed-partition-originals
          path: |
            artifacts/test-results/managed-originals/**
            artifacts/test-results/managed/test-evidence.json
          if-no-files-found: error
