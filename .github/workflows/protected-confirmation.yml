name: Protected content confirmation probe
run-name: ${{ inputs.contract }} (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      contract:
        description: Select protected confirmation, journal qualification or signed KeepRemote
        type: choice
        options:
          - prototype
          - managed
          - access-journal
          - journal-reconciliation
          - signed-keep-remote
        default: prototype

permissions:
  contents: read

jobs:
  probe:
    if: inputs.contract != 'signed-keep-remote'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: win-x64
          - runner: windows-11-arm
            runtime: win-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore locked test dependencies
        run: |
          pwsh ./eng/restore-adapter-sdk.ps1
          dotnet restore tests/MirrorPulse.CloudFiles.CfSharp.Tests --locked-mode

      - name: Build native test boundary
        run: dotnet build tests/MirrorPulse.CloudFiles.CfSharp.Tests --configuration Release --no-restore

      - name: Prepare disposable native volume
        run: pwsh ./eng/prepare-native-ci-volume.ps1

      - name: Verify protected confirmation
        if: inputs.contract != 'access-journal' && inputs.contract != 'journal-reconciliation'
        shell: pwsh
        env:
          MIRRORPULSE_NATIVE_TEST: '1'
          CONFIRMATION_CONTRACT: ${{ inputs.contract || 'prototype' }}
        run: |
          $filter = if ($env:CONFIRMATION_CONTRACT -eq 'managed') {
            'FullyQualifiedName~MirrorPulseContentConfirmationTests.NativeManagedConfirmation|FullyQualifiedName~MirrorPulseContentConfirmationRecoveryTests'
          } else { 'FullyQualifiedName~MirrorPulseProtectedConfirmationTests' }
          dotnet test tests/MirrorPulse.CloudFiles.CfSharp.Tests --configuration Release --no-build --filter $filter --logger trx --results-directory artifacts/protected-confirmation
          if ($LASTEXITCODE -ne 0) { throw 'Protected content confirmation failed.' }

      - name: Collect safe probe evidence
        if: always() && inputs.contract != 'access-journal' && inputs.contract != 'journal-reconciliation'
        shell: pwsh
        env:
          CONFIRMATION_CONTRACT: ${{ inputs.contract || 'prototype' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath artifacts/protected-confirmation -Filter '*.trx' -File)
          if ($files.Count -ne 1) { throw 'Expected exactly one protected confirmation result file.' }
          [xml]$trx = Get-Content -LiteralPath $files[0].FullName -Raw
          $results = @($trx.SelectNodes("//*[local-name()='UnitTestResult']"))
          $expected = if ($env:CONFIRMATION_CONTRACT -eq 'managed') { 12 } else { 15 }
          $observations = @($results | ForEach-Object { $_.SelectNodes(".//*[local-name()='StdOut']") } | ForEach-Object { $_.InnerText -split "`r?`n" } | Where-Object { $_ -match '^Protected confirmation |^Confirmation:|^Confirmation matrix:' })
          $report = [ordered]@{
            schemaVersion = 1
            sourceSha = '${{ github.sha }}'
            runtime = '${{ matrix.runtime }}'
            contract = $env:CONFIRMATION_CONTRACT
            expected = $expected
            selected = $results.Count
            executed = @($results | Where-Object outcome -notin @('NotExecuted', 'Inconclusive')).Count
            passed = @($results | Where-Object outcome -eq 'Passed').Count
            results = @($results | ForEach-Object { [ordered]@{name = [string]$_.testName; outcome = [string]$_.outcome} })
            observations = $observations
          }
          $report | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath artifacts/protected-confirmation/report.json -Encoding utf8
          $observations | ForEach-Object { Write-Output $_ }
          if ($report.selected -ne $expected -or $report.executed -ne $expected -or $report.passed -ne $expected) { throw 'Every protected confirmation case must execute and pass.' }

      - name: Upload safe probe report
        if: always() && inputs.contract != 'access-journal' && inputs.contract != 'journal-reconciliation'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-protected-${{ matrix.runtime }}
          path: artifacts/protected-confirmation/report.json
          if-no-files-found: error

      - name: Retain the original journal fixture deadlines
        id: journal-budget
        if: inputs.contract == 'access-journal' || inputs.contract == 'journal-reconciliation'
        shell: pwsh
        env:
          JOURNAL_SCOPE: ${{ inputs.contract }}
        run: |
          $minutes = & ./eng/verify-keep-remote-native.ps1 -BudgetOnly -Scope $env:JOURNAL_SCOPE
          if ($LASTEXITCODE -ne 0) { throw 'Journal qualification selection failed.' }
          "timeout_minutes=$minutes" >> $env:GITHUB_OUTPUT

      - name: Verify the selected journal boundary
        if: inputs.contract == 'access-journal' || inputs.contract == 'journal-reconciliation'
        timeout-minutes: ${{ fromJSON(steps.journal-budget.outputs.timeout_minutes) }}
        shell: pwsh
        env:
          JOURNAL_SCOPE: ${{ inputs.contract }}
          JOURNAL_ARCHITECTURE: ${{ matrix.runtime == 'win-arm64' && 'Arm64' || 'X64' }}
        run: |
          pwsh ./eng/verify-keep-remote-native.ps1 -Scope $env:JOURNAL_SCOPE -ExpectedArchitecture $env:JOURNAL_ARCHITECTURE

      - name: Upload original journal qualification evidence
        if: always() && (inputs.contract == 'access-journal' || inputs.contract == 'journal-reconciliation')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-${{ inputs.contract }}-${{ matrix.runtime }}
          path: artifacts/test-results/keep-remote-native
          if-no-files-found: error

  signed-keep-remote:
    if: inputs.contract == 'signed-keep-remote'
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore locked test dependencies
        shell: pwsh
        run: |
          pwsh ./eng/restore-adapter-sdk.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Adapter SDK restore failed.' }
          dotnet restore MirrorPulse.sln --locked-mode

      - name: Freeze and verify the signed Local Adapter
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pwsh ./eng/prepare-native-ci-volume.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Disposable native volume preparation failed.' }
          pwsh ./eng/verify-official-adapter-release-policy.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Official candidate selection failed.' }
          pwsh ./eng/resolve-official-adapter-releases.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The official release candidate could not be frozen.' }
          pwsh ./eng/aggregate-official-adapters.ps1 -ReleaseLockPath artifacts/official-adapter-releases.json -AdapterIds com.mirrorpulse.adapter.local -OutputDirectory artifacts/official-local

      - name: Verify signed ARM64 coalesced KeepRemote through the default Host
        shell: pwsh
        timeout-minutes: 10
        env:
          MIRRORPULSE_NATIVE_TEST: '1'
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/official-local -Recurse -Filter '*.mpadapter' -File)
          if ($packages.Count -ne 1 -or -not (Test-Path -LiteralPath ($packages[0].FullName + '.signature.json'))) { throw 'The exact frozen signed Local package is required.' }
          New-Item -ItemType Directory -Path artifacts/evidence/cli-keep-remote -Force | Out-Null
          pwsh ./eng/verify-cli-integration.ps1 -Runtime win-arm64 -PackagePath $packages[0].FullName -Coalescing -CoalescingAction KeepRemote -EvidencePath artifacts/evidence/cli-keep-remote/report.json
          if ($LASTEXITCODE -ne 0) { throw 'The real signed KeepRemote conflict choice failed.' }

      - name: Preserve signed ARM64 KeepRemote results and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-keep-remote-arm64-originals
          path: artifacts/evidence/cli-keep-remote/**
          if-no-files-found: ignore
