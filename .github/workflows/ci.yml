          if-no-files-found: error

  namespace-nonadmin-arm64:
    if: github.event_name == 'workflow_dispatch' && !inputs.s06_recovery_only && !inputs.file_transfer_acceptance_only
    needs: official-adapter-candidate
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: official-adapter-release-lock
          path: artifacts
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Prepare the ARM64 namespace test assembly
        shell: pwsh
        run: |
          $testProject = 'tests/MirrorPulse.CloudFiles.CfSharp.Tests/MirrorPulse.CloudFiles.CfSharp.Tests.csproj'
          pwsh ./eng/restore-adapter-sdk.ps1 -RequireCachedPackage
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Adapter SDK acquisition failed.' }
          dotnet restore $testProject --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet build $testProject --configuration Release --no-restore -m:1 -p:UseSharedCompilation=false
          if ($LASTEXITCODE -ne 0) { throw 'Namespace verification build failed.' }
          pwsh ./eng/prepare-native-ci-volume.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The disposable namespace test volume is unavailable.' }

      - name: Determine ordinary-user verification envelope
        id: namespace-nonadmin-budget
        shell: pwsh
        run: |
          . ./eng/namespace-nonadmin-controller.ps1
          $catalog = Get-Content ./eng/test-suites.json -Raw | ConvertFrom-Json
          $minutes = Get-OrdinaryUserNamespaceStepTimeoutMinutes -TestCount @($catalog.required.namespace).Count -TestNames @($catalog.required.namespace) -Scope S06
          "timeout_minutes=$minutes" >> $env:GITHUB_OUTPUT

      - name: Verify strict Cloud Files ACLs as a fresh non-administrator user
        shell: pwsh
        timeout-minutes: ${{ fromJSON(steps.namespace-nonadmin-budget.outputs.timeout_minutes) }}
        run: pwsh ./eng/verify-namespace-nonadmin.ps1 -ExpectedArchitecture Arm64

      - name: Upload original ordinary-user namespace results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: namespace-nonadmin-arm64-test-results
          path: artifacts/test-results/namespace-nonadmin-arm64/**
          if-no-files-found: ignore

      - name: Preserve original ordinary-user executing inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: namespace-nonadmin-arm64-executing-originals
          path: artifacts/test-results/namespace-nonadmin-arm64-originals/**
          if-no-files-found: warn

  official-package-arm64-evidence:
    if: github.event_name == 'workflow_dispatch'
    needs: [official-adapter-candidate, official-package-arm64, namespace-nonadmin-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: official-adapter-release-lock
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cli-host-win-arm64
          path: ${{ runner.temp }}/mirrorpulse-cli-host-win-arm64
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: arm64-evidence-inputs
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: namespace-nonadmin-arm64-test-results
          path: artifacts/test-results/namespace-nonadmin-arm64

      - name: Collect ARM64 verification evidence
        shell: pwsh
        run: |
          $parameters = @{
            Job = 'official-package-arm64'; Runtime = 'win-arm64'; OutputPath = 'artifacts/evidence/official-package-arm64.json'
            TestManifests = @('artifacts/test-results/signed/test-evidence.json', 'artifacts/test-results/namespace-arm64/test-evidence.json')
            RequireNamespace = $true
            NamespaceNonAdminPath = 'artifacts/test-results/namespace-nonadmin-arm64/ordinary-user-evidence.json'
            PublishDirectory = "$env:RUNNER_TEMP/mirrorpulse-cli-host-win-arm64"
            IntegrationPath = 'artifacts/evidence/cli-regression.json'
            AdapterReleaseLockPath = 'artifacts/official-adapter-releases.json'
          }
          $parameters.RequireInstalled = $true
          if ('${{ inputs.verify_shell }}' -eq 'true') { $parameters.RequireInstalledShell = $true }
          $parameters.InstalledPath = 'artifacts/evidence/installed.json'
          $parameters.TransferIntegrationPath = 'artifacts/evidence/cli-transfers.json'
          $parameters.CrossPackageTransferIntegrationPath = 'artifacts/evidence/cli-cross-package.json'
          ./eng/collect-ci-evidence.ps1 @parameters

      - name: Upload ARM64 verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-official-package-arm64
          path: artifacts/evidence/official-package-arm64.json
          if-no-files-found: error

  official-adapters:
    if: github.event_name != 'workflow_dispatch' || (!inputs.s06_recovery_only && !inputs.file_transfer_acceptance_only)
    needs: official-adapter-candidate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the shared official candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: official-adapter-release-lock
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore package verifier
        run: |
          pwsh ./eng/restore-adapter-sdk.ps1 -RequireCachedPackage
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Adapter SDK acquisition failed.' }
          dotnet restore tests/MirrorPulse.Core.Tests/MirrorPulse.Core.Tests.csproj --locked-mode

      - name: Aggregate the frozen official Adapter releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pwsh ./eng/verify-official-adapter-release-policy.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Official stable release selection failed.' }
          pwsh ./eng/verify-official-adapter-signatures.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Official signature contract failed.' }
          pwsh ./eng/aggregate-official-adapters.ps1 -ReleaseLockPath artifacts/official-adapter-releases.json -OutputDirectory "$env:GITHUB_WORKSPACE/artifacts/official-adapters"

      - name: Download previous signed Local Adapter release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $directory = "$env:GITHUB_WORKSPACE/artifacts/local-previous"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          gh release download v0.1.3 --repo MirrorPulse/adapter-local --dir $directory --pattern 'com.mirrorpulse.adapter.local-0.1.3.mpadapter*'
          if ($LASTEXITCODE -ne 0) { throw 'The previous signed Local Adapter release could not be downloaded.' }

      - name: Create local SMB test share
        shell: pwsh
        run: |
          $backing = Join-Path $env:RUNNER_TEMP 'mirrorpulse-smb-test'
          New-Item -ItemType Directory -Path $backing -Force | Out-Null
          New-SmbShare -Name MirrorPulseCiTest -Path $backing -FullAccess $env:USERNAME -ErrorAction Stop | Out-Null
          "MIRRORPULSE_SMB_TEST_SHARE=\\localhost\MirrorPulseCiTest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MIRRORPULSE_SMB_TEST_BACKING=$backing" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install every signed official Adapter with the production verifier
        env:
          MIRRORPULSE_OFFICIAL_AGGREGATE: ${{ github.workspace }}/artifacts/official-adapters
          MIRRORPULSE_LOCAL_PREVIOUS_RELEASE: ${{ github.workspace }}/artifacts/local-previous
        run: |
          dotnet test tests/MirrorPulse.Core.Tests/MirrorPulse.Core.Tests.csproj --configuration Release --no-restore --filter "TestCategory=OfficialPackages" --logger trx --results-directory artifacts/test-results/official
          if ($LASTEXITCODE -ne 0) { throw 'Official Adapter tests failed.' }
          pwsh ./eng/verify-test-results.ps1 -Suite official -ResultsDirectory artifacts/test-results/official

      - name: Remove local SMB test share
        if: always()
        shell: pwsh
        run: |
          if (Get-SmbShare -Name MirrorPulseCiTest -ErrorAction SilentlyContinue) {
            Remove-SmbShare -Name MirrorPulseCiTest -Force
          }

      - name: Upload official Adapter aggregate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: official-adapters
          path: artifacts/official-adapters
          if-no-files-found: error

      - name: Collect official Adapter verification evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/evidence -Force | Out-Null
          ./eng/collect-ci-evidence.ps1 -Job official-adapters -Runtime win-x64 -OutputPath artifacts/evidence/official-adapters.json -TestManifests artifacts/test-results/official/test-evidence.json -AdapterDirectory artifacts/official-adapters -AdapterReleaseLockPath artifacts/official-adapter-releases.json

      - name: Upload official Adapter verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-official-adapters
          path: artifacts/evidence/official-adapters.json
          if-no-files-found: error
