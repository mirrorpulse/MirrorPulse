name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      direct_edition_acceptance_only:
        description: Run only ARM64 installed edition acceptance
        type: boolean
        default: false
      verify_installed_authorization:
        description: Use a signed authorization fixture for the installed edition acceptance
        type: boolean
        default: false
      file_transfer_acceptance_only:
        description: Run only signed ARM64 CLI transfers across Local and Local/WebDAV deployments
        type: boolean
        default: false
      verify_remote_sync_restart:
        description: Include interrupted remote polling in the signed ARM64 CLI transfer fixtures
        type: boolean
        default: false
      s06_recovery_only:
        description: Run only the signed ARM64 S06 recovery scenarios
        type: boolean
        default: false
      directory_acceptance_only:
        description: Run only signed Local directory Delete, Move, and cross-instance directory and local-only file transfer acceptance
        type: boolean
        default: false
      verify_shell:
        description: Run the Shell registration probe from the installed App process
        type: boolean
        default: false
      verify_atomic_directory:
        description: Run the signed Local atomic directory acceptance on x64 and ARM64
        type: boolean
        default: false
      verify_directory_move:
        description: Run signed Local directory Move acceptance on x64 and ARM64
        type: boolean
        default: false
      verify_directory_transfer:
        description: Run signed cross-instance directory and local-only file transfer acceptance on x64 and ARM64
        type: boolean
        default: false
      verify_prepared_directory_copy:
        description: Run focused recovery acceptance with a signed Local package that supports copy preparation
        type: boolean
        default: false
      local_atomic_preview:
        description: Published Local preview tag for signed directory acceptance
        type: string
        required: false
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  signed-direct-edition:
    if: github.event_name == 'workflow_dispatch' && inputs.direct_edition_acceptance_only
    uses: ./.github/workflows/edition-coexistence.yml
    with:
      verify_signed_direct_local: ${{ !inputs.verify_installed_authorization }}
      verify_installed_authorization: ${{ inputs.verify_installed_authorization }}

  signed-atomic-directory:
    if: github.event_name == 'workflow_dispatch' && !inputs.direct_edition_acceptance_only && !inputs.s06_recovery_only && !inputs.file_transfer_acceptance_only && (inputs.directory_acceptance_only || inputs.verify_atomic_directory || inputs.verify_directory_move || inputs.verify_directory_transfer || inputs.verify_prepared_directory_copy)
    uses: ./.github/workflows/signed-atomic-directory.yml
    with:
      local_preview: ${{ inputs.local_atomic_preview }}
      verify_atomic_directory: ${{ (inputs.directory_acceptance_only && !inputs.verify_prepared_directory_copy) || inputs.verify_atomic_directory }}
      verify_directory_move: ${{ (inputs.directory_acceptance_only && !inputs.verify_prepared_directory_copy) || inputs.verify_directory_move }}
      verify_directory_transfer: ${{ (inputs.directory_acceptance_only && !inputs.verify_prepared_directory_copy) || inputs.verify_directory_transfer }}
      verify_prepared_directory_copy: ${{ inputs.verify_prepared_directory_copy }}

  official-adapter-candidate:
    if: >-
      github.event_name != 'workflow_dispatch' || (!inputs.direct_edition_acceptance_only &&
        (inputs.s06_recovery_only || inputs.file_transfer_acceptance_only || !(inputs.directory_acceptance_only || inputs.verify_prepared_directory_copy) || inputs.verify_shell))
    runs-on: windows-latest
    steps:
      - name: Check out the candidate product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify stable selection and freeze official release identities once
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pwsh ./eng/verify-official-adapter-release-policy.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Official candidate selection failed.' }
          pwsh ./eng/resolve-official-adapter-releases.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The official release candidate could not be frozen.' }
          pwsh ./eng/restore-adapter-sdk.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The exact pinned Adapter SDK could not be frozen.' }
      - name: Share the exact official release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: official-adapter-release-lock
          path: |
            artifacts/official-adapter-releases.json
            artifacts/sdk-feed
          if-no-files-found: error

  signed-file-transfer:
    if: github.event_name == 'workflow_dispatch' && !inputs.s06_recovery_only && inputs.file_transfer_acceptance_only
    needs: official-adapter-candidate
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      MIRRORPULSE_NATIVE_TEST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: official-adapter-release-lock
          path: artifacts
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Prepare the locked build inputs and official Local package
        id: prepare
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./eng/restore-adapter-sdk.ps1 -RequireCachedPackage
          dotnet restore MirrorPulse.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          ./eng/prepare-native-ci-volume.ps1
          ./eng/aggregate-official-adapters.ps1 -ReleaseLockPath artifacts/official-adapter-releases.json -AdapterIds com.mirrorpulse.adapter.local -OutputDirectory artifacts/official-local
      - name: Verify signed Local transfers and poll recovery across actual Host restarts
        shell: pwsh
        timeout-minutes: 10
        env:
          MP_VERIFY_REMOTE_SYNC_RESTART: ${{ inputs.verify_remote_sync_restart && '1' || '0' }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/official-local -Recurse -Filter '*.mpadapter' -File)
          if ($packages.Count -ne 1) { throw 'The exact frozen signed Local package is required.' }
          $poll = @()
          if ($env:MP_VERIFY_REMOTE_SYNC_RESTART -ceq '1') { $poll += '-VerifyRemoteSyncRecovery' }
          pwsh -NoProfile -File ./eng/verify-cli-transfers.ps1 -Runtime win-arm64 -PackagePath $packages[0].FullName @poll -EvidencePath artifacts/evidence/cli-transfers.json
          if ($LASTEXITCODE -ne 0) { throw 'The signed Local file transfer fixture failed.' }
      - name: Verify signed Local and WebDAV transfers and poll recovery across actual Host restarts
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MP_VERIFY_REMOTE_SYNC_RESTART: ${{ inputs.verify_remote_sync_restart && '1' || '0' }}
        run: |
          $poll = @()
          if ($env:MP_VERIFY_REMOTE_SYNC_RESTART -ceq '1') { $poll += '-VerifyRemoteSyncRecovery' }
          pwsh -NoProfile -File ./eng/verify-cli-cross-package.ps1 -Runtime win-arm64 -ReleaseLockPath artifacts/official-adapter-releases.json -LocalPackageDirectory artifacts/official-local -WebDavPackageDirectory artifacts/official-transfer-webdav @poll -EvidencePath artifacts/evidence/cli-cross-package.json
          if ($LASTEXITCODE -ne 0) { throw 'The signed Local and WebDAV file transfer fixture failed.' }
      - name: Preserve both signed fixture reports and raw failure observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-file-transfer-arm64-originals
          path: |
            artifacts/evidence/cli-transfers.json
            artifacts/evidence/cli-transfers.originals/**
            artifacts/evidence/cli-cross-package.json
            artifacts/evidence/cli-cross-package.originals/**
            artifacts/official-adapter-releases.json
          if-no-files-found: warn

  signed-s06-recovery:
    if: github.event_name == 'workflow_dispatch' && (inputs.s06_recovery_only || (inputs.verify_shell && !inputs.file_transfer_acceptance_only))
    needs: official-adapter-candidate
    runs-on: windows-11-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [disabled-backlog, legacy-source, edited-source]
    env:
      MIRRORPULSE_NATIVE_TEST: '1'
      S06_RECOVERY_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: official-adapter-release-lock
          path: artifacts
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Prepare the frozen signed Local package and locked build inputs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pwsh ./eng/restore-adapter-sdk.ps1 -RequireCachedPackage
          if ($LASTEXITCODE -ne 0) { throw 'The candidate Adapter SDK could not be restored.' }
          dotnet restore MirrorPulse.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          pwsh ./eng/prepare-native-ci-volume.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The disposable native volume could not be prepared.' }
          pwsh ./eng/aggregate-official-adapters.ps1 -ReleaseLockPath artifacts/official-adapter-releases.json -AdapterIds com.mirrorpulse.adapter.local -OutputDirectory artifacts/official-local
          if ($LASTEXITCODE -ne 0) { throw 'The frozen signed Local package could not be restored.' }
      - name: Download the signed Local V1 reference
        if: matrix.scenario == 'legacy-source'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path artifacts/local-v1 -Force | Out-Null
          gh release download v0.1.3 --repo mirrorpulse/adapter-local --dir artifacts/local-v1 --pattern 'com.mirrorpulse.adapter.local-0.1.3.mpadapter*'
          if ($LASTEXITCODE -ne 0) { throw 'The signed Local V1 release could not be downloaded.' }
      - name: Verify signed recovery against the same candidate
        shell: pwsh
        timeout-minutes: 15
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/official-local -Recurse -Filter '*.mpadapter' -File)
          if ($packages.Count -ne 1 -or -not (Test-Path -LiteralPath ($packages[0].FullName + '.signature.json'))) { throw 'The exact frozen signed Local package is required.' }
          $evidencePath = Join-Path 'artifacts/evidence' $env:S06_RECOVERY_SCENARIO
          New-Item -ItemType Directory -Path $evidencePath -Force | Out-Null
          $report = Join-Path $evidencePath 'report.json'
          switch -CaseSensitive ($env:S06_RECOVERY_SCENARIO) {
            'disabled-backlog' {
              pwsh ./eng/verify-cli-disabled-operations.ps1 -Runtime win-arm64 -PackagePath $packages[0].FullName -LargeBacklog -EvidencePath $report
            }
            'legacy-source' {
              pwsh ./eng/verify-cli-transfers.ps1 -Runtime win-arm64 -PackagePath $packages[0].FullName -LegacySourcePackagePath artifacts/local-v1/com.mirrorpulse.adapter.local-0.1.3.mpadapter -EvidencePath $report
            }
            'edited-source' {
              pwsh ./eng/verify-cli-disabled-operations.ps1 -Runtime win-arm64 -PackagePath $packages[0].FullName -EditedSourceConflict -EvidencePath $report
            }
            default { throw 'The signed S06 recovery scenario is unknown.' }
          }
          if ($LASTEXITCODE -ne 0) { throw 'The signed S06 recovery scenario failed.' }
      - name: Preserve original evidence and the shared release candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: s06-${{ matrix.scenario }}-arm64-originals
          path: |
            artifacts/evidence/${{ matrix.scenario }}/**
            artifacts/official-adapter-releases.json
          if-no-files-found: warn

  prepare-x64:
    if: github.event_name != 'workflow_dispatch' || (!inputs.s06_recovery_only && !inputs.file_transfer_acceptance_only)
    needs: official-adapter-candidate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: official-adapter-release-lock
          path: artifacts
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build and record the complete managed test inventory
        shell: pwsh
        run: |
          ./eng/restore-adapter-sdk.ps1 -RequireCachedPackage
          dotnet restore MirrorPulse.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet build MirrorPulse.sln --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
          ./eng/collect-managed-test-originals.ps1 -Phase Prepare -Partitioned
          ./eng/collect-compiled-test-inventory.ps1 -Phase Discover
      - name: Archive the common Release build
        shell: pwsh
        run: |
          $projects = @(git ls-files '*.csproj')
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate the solution project paths.' }
          $paths = @($projects | ForEach-Object {
            $bin = (Split-Path -Parent $_) + '/bin/Release'
            if (Test-Path -LiteralPath $bin) { $bin }
          })
          if ($paths.Count -eq 0) { throw 'Release output directories are missing.' }
          $paths += 'artifacts/test-results/managed-originals'
          tar.exe -cf artifacts/managed-build.tar @paths
          if ($LASTEXITCODE -ne 0) { throw 'Archiving the Release build failed.' }
          (Get-FileHash -LiteralPath artifacts/managed-build.tar).Hash | Set-Content -LiteralPath artifacts/managed-build.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: managed-release-build
          path: |
            artifacts/managed-build.tar
            artifacts/managed-build.sha256
          if-no-files-found: error
          retention-days: 3

  managed-tests:
    needs: prepare-x64
    uses: ./.github/workflows/managed-tests.yml

  verify-x64:
    needs: prepare-x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the shared official candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: official-adapter-release-lock
          path: artifacts

      - name: Download the common Release build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: managed-release-build
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          pwsh ./eng/restore-adapter-sdk.ps1 -RequireCachedPackage
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Adapter SDK acquisition failed.' }
          dotnet restore MirrorPulse.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          ./eng/expand-managed-test-build.ps1

      - name: Verify formatting
        run: pwsh ./eng/verify-format.ps1

      - name: Verify Windows targets
        run: pwsh ./eng/verify-platform.ps1

      - name: Verify client ownership
        run: pwsh ./eng/verify-architecture.ps1

      - name: Verify x64 CLI entry point
        run: pwsh ./eng/verify-cli-publish.ps1 -Runtime win-x64

      - name: Verify x64 CLI and Host publish manifest
        shell: pwsh
        run: pwsh ./eng/verify-cli-host-publish.ps1 -Runtime win-x64 -OutputDirectory "$env:RUNNER_TEMP/mirrorpulse-cli-host-win-x64"

      - name: Upload x64 CLI and Host publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-host-win-x64
          path: ${{ runner.temp }}/mirrorpulse-cli-host-win-x64
          if-no-files-found: error

      - name: Verify CLI completion gate
        run: pwsh ./eng/verify-cli-complete.ps1 -Configuration Release

      - name: Verify Host publishes
        run: pwsh ./eng/verify-publish.ps1

      - name: Verify native Cloud Files integration
        if: github.event_name == 'workflow_dispatch'
        run: |
          pwsh ./eng/prepare-native-ci-volume.ps1
          pwsh ./eng/verify-native.ps1

      - name: Verify unsupported Windows Server rejection
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/x64-platform-evidence -Force | Out-Null
          pwsh ./eng/verify-unsupported-platform.ps1 -PublishDirectory "$env:RUNNER_TEMP/mirrorpulse-cli-host-win-x64" -EvidencePath artifacts/x64-platform-evidence/rejected.json

      - name: Stage the native gate receipt for manual runs
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: Copy-Item -LiteralPath artifacts/test-results/native/test-evidence.json -Destination artifacts/x64-platform-evidence/native.json

      - name: Upload x64 platform evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: x64-platform-evidence
          path: artifacts/x64-platform-evidence/**
          if-no-files-found: error

      - name: Upload native boundary test results
        if: (success() || failure()) && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-test-results
          path: artifacts/test-results/native/**/*.trx
          if-no-files-found: warn

      - name: Preserve original native executing inputs
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-executing-originals
          path: artifacts/test-results/native-originals/**
          if-no-files-found: warn

      - name: Verify retained P079 multi-root transfer compatibility on x64
        if: (success() || failure()) && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: pwsh ./eng/verify-deferred-p079.ps1 -ExpectedArchitecture X64

      - name: Preserve original deferred P079 x64 results
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deferred-p079-x64-test-results
          path: artifacts/test-results/deferred-p079-x64/**
          if-no-files-found: warn

  build-and-test:
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'workflow_dispatch' ||
        ((!inputs.s06_recovery_only && !inputs.file_transfer_acceptance_only) && needs.official-adapter-candidate.result != 'skipped'))
    needs: [official-adapter-candidate, managed-tests, verify-x64]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Require successful managed and x64 verification
        shell: pwsh
        env:
          CANDIDATE_RESULT: ${{ needs.official-adapter-candidate.result }}
          MANAGED_RESULT: ${{ needs.managed-tests.result }}
          PLATFORM_RESULT: ${{ needs.verify-x64.result }}
        run: |
          if ($env:CANDIDATE_RESULT -cne 'success' -or $env:MANAGED_RESULT -cne 'success' -or $env:PLATFORM_RESULT -cne 'success') {
            throw 'The official candidate, managed test inventory and x64 platform verification must all pass.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: official-adapter-release-lock
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: managed-test-evidence
          path: artifacts/test-results/managed
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: x64-platform-evidence
          path: artifacts/x64-platform-evidence
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cli-host-win-x64
          path: ${{ runner.temp }}/mirrorpulse-cli-host-win-x64
      - name: Collect x64 verification evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/evidence -Force | Out-Null
          $parameters = @{
            Job = 'build-and-test'; Runtime = 'win-x64'; OutputPath = 'artifacts/evidence/build-and-test.json'
            TestManifests = @('artifacts/test-results/managed/test-evidence.json')
            PublishDirectory = "$env:RUNNER_TEMP/mirrorpulse-cli-host-win-x64"
            RejectedPath = 'artifacts/x64-platform-evidence/rejected.json'
            AdapterReleaseLockPath = 'artifacts/official-adapter-releases.json'
          }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $parameters.TestManifests += 'artifacts/x64-platform-evidence/native.json'
            $parameters.RequireNative = $true
          }
          ./eng/collect-ci-evidence.ps1 @parameters

      - name: Upload x64 verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-build-and-test
          path: artifacts/evidence/build-and-test.json
          if-no-files-found: error

  official-package-arm64:
    if: github.event_name != 'workflow_dispatch' || (!inputs.s06_recovery_only && !inputs.file_transfer_acceptance_only)
    needs: official-adapter-candidate
    runs-on: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the shared official candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: official-adapter-release-lock
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          pwsh ./eng/restore-adapter-sdk.ps1 -RequireCachedPackage
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Adapter SDK acquisition failed.' }
          dotnet restore MirrorPulse.sln --locked-mode

      - name: Verify ARM64 CLI entry point
        run: pwsh ./eng/verify-cli-publish.ps1 -Runtime win-arm64

      - name: Verify ARM64 CLI and Host publish manifest
        shell: pwsh
        run: pwsh ./eng/verify-cli-host-publish.ps1 -Runtime win-arm64 -OutputDirectory "$env:RUNNER_TEMP/mirrorpulse-cli-host-win-arm64"

      - name: Upload ARM64 CLI and Host publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-host-win-arm64
          path: ${{ runner.temp }}/mirrorpulse-cli-host-win-arm64
          if-no-files-found: error

      - name: Verify ARM64 SDK Delete recovery before Host integration
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          pwsh ./eng/prepare-native-ci-volume.ps1
          if ($LASTEXITCODE -ne 0) { throw 'The disposable SDK test volume is unavailable.' }
          pwsh ./eng/verify-cfsharp-delete-recovery.ps1 -ExpectedArchitecture Arm64

      - name: Preserve original ARM64 SDK Delete results
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cfsharp-delete-arm64-originals
          path: artifacts/test-results/cfsharp-delete-arm64/**
          if-no-files-found: ignore

      - name: Verify ARM64 SDK explicit identities at retired paths
        id: sdk-recreation
        if: (success() || failure()) && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 8
        env:
