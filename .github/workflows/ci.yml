name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_shell:
        description: Run the Shell registration probe from the installed App process
        type: boolean
        default: false
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          pwsh ./eng/restore-adapter-sdk.ps1
          dotnet restore MirrorPulse.sln --locked-mode

      - name: Verify formatting
        run: pwsh ./eng/verify-format.ps1

      - name: Verify Windows targets
        run: pwsh ./eng/verify-platform.ps1

      - name: Verify client ownership
        run: pwsh ./eng/verify-architecture.ps1

      - name: Build
        run: dotnet build MirrorPulse.sln --configuration Release --no-restore

      - name: Verify x64 CLI entry point
        run: pwsh ./eng/verify-cli-publish.ps1 -Runtime win-x64

      - name: Verify x64 CLI and Host publish manifest
        shell: pwsh
        run: pwsh ./eng/verify-cli-host-publish.ps1 -Runtime win-x64 -OutputDirectory "$env:RUNNER_TEMP/mirrorpulse-cli-host-win-x64"

      - name: Upload x64 CLI and Host publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-host-win-x64
          path: ${{ runner.temp }}/mirrorpulse-cli-host-win-x64
          if-no-files-found: error

      - name: Install SFTP fixture dependencies
        run: pwsh ./eng/setup-test-environment.ps1

      - name: Test
        run: |
          dotnet test MirrorPulse.sln --configuration Release --no-build --logger trx --results-directory artifacts/test-results/managed
          if ($LASTEXITCODE -ne 0) { throw 'Managed tests failed.' }
          pwsh ./eng/verify-test-results.ps1 -Suite managed -ResultsDirectory artifacts/test-results/managed

      - name: Verify CLI completion gate
        run: pwsh ./eng/verify-cli-complete.ps1 -Configuration Release

      - name: Verify Host publishes
        run: pwsh ./eng/verify-publish.ps1

      - name: Verify native Cloud Files integration
        if: github.event_name == 'workflow_dispatch'
        run: |
          pwsh ./eng/prepare-native-ci-volume.ps1
          pwsh ./eng/verify-native.ps1

      - name: Verify unsupported Windows Server rejection
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/evidence -Force | Out-Null
          pwsh ./eng/verify-unsupported-platform.ps1 -PublishDirectory "$env:RUNNER_TEMP/mirrorpulse-cli-host-win-x64" -EvidencePath artifacts/evidence/rejected.json

      - name: Collect x64 verification evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/evidence -Force | Out-Null
          $parameters = @{
            Job = 'build-and-test'; Runtime = 'win-x64'; OutputPath = 'artifacts/evidence/build-and-test.json'
            TestManifests = @('artifacts/test-results/managed/test-evidence.json')
            PublishDirectory = "$env:RUNNER_TEMP/mirrorpulse-cli-host-win-x64"
            RejectedPath = 'artifacts/evidence/rejected.json'
          }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $parameters.TestManifests += 'artifacts/test-results/native/test-evidence.json'
            $parameters.RequireNative = $true
          }
          ./eng/collect-ci-evidence.ps1 @parameters

      - name: Upload x64 verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-build-and-test
          path: artifacts/evidence/build-and-test.json
          if-no-files-found: error

  official-package-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          pwsh ./eng/restore-adapter-sdk.ps1
          dotnet restore MirrorPulse.sln --locked-mode

      - name: Install SFTP fixture dependencies
        run: pwsh ./eng/setup-test-environment.ps1

      - name: Verify ARM64 CLI entry point
        run: pwsh ./eng/verify-cli-publish.ps1 -Runtime win-arm64

      - name: Verify ARM64 CLI and Host publish manifest
        shell: pwsh
        run: pwsh ./eng/verify-cli-host-publish.ps1 -Runtime win-arm64 -OutputDirectory "$env:RUNNER_TEMP/mirrorpulse-cli-host-win-arm64"

      - name: Upload ARM64 CLI and Host publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-host-win-arm64
          path: ${{ runner.temp }}/mirrorpulse-cli-host-win-arm64
          if-no-files-found: error

      - name: Verify ARM64 CLI through signed Local Adapter and Cloud Files
        shell: pwsh
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pwsh ./eng/prepare-native-ci-volume.ps1
          $directory = Join-Path $env:RUNNER_TEMP 'mirrorpulse-cli-local'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          gh release download --repo MirrorPulse/adapter-local --dir $directory --pattern '*.mpadapter*'
          if ($LASTEXITCODE -ne 0) { throw 'The signed Local Adapter release could not be downloaded.' }
          $package = Get-ChildItem -LiteralPath $directory -Filter '*.mpadapter' -File | Select-Object -First 1
          if ($null -eq $package -or -not (Test-Path -LiteralPath "$($package.FullName).signature.json")) {
            throw 'The Local Adapter package or signature is missing.'
          }
          New-Item -ItemType Directory -Path artifacts/evidence -Force | Out-Null
          pwsh ./eng/verify-cli-regression.ps1 -Runtime win-arm64 -PackagePath $package.FullName -EvidencePath artifacts/evidence/cli-regression.json

      - name: Verify signed official packages and native ARM64 Workers
        run: |
          dotnet test tests/MirrorPulse.Core.Tests/MirrorPulse.Core.Tests.csproj --configuration Release --no-restore --filter FullyQualifiedName~SignedPackageProcessTests --logger trx --results-directory artifacts/test-results/signed
          if ($LASTEXITCODE -ne 0) { throw 'Signed ARM64 Worker tests failed.' }
          pwsh ./eng/verify-test-results.ps1 -Suite signed -ResultsDirectory artifacts/test-results/signed

      - name: Verify installed ARM64 MSIX on Windows 11 desktop
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          MIRRORPULSE_VERIFY_SHELL: ${{ inputs.verify_shell }}
        run: |
          New-Item -ItemType Directory -Path artifacts/evidence -Force | Out-Null
          if ($env:MIRRORPULSE_VERIFY_SHELL -eq 'true') {
            pwsh ./eng/verify-msix-cloudfiles.ps1 -Runtime win-arm64 -VerifyShell -EvidencePath artifacts/evidence/installed.json
          } else {
            pwsh ./eng/verify-msix-cloudfiles.ps1 -Runtime win-arm64 -EvidencePath artifacts/evidence/installed.json
          }

      - name: Collect ARM64 verification evidence
        shell: pwsh
        run: |
          $parameters = @{
            Job = 'official-package-arm64'; Runtime = 'win-arm64'; OutputPath = 'artifacts/evidence/official-package-arm64.json'
            TestManifests = @('artifacts/test-results/signed/test-evidence.json')
            PublishDirectory = "$env:RUNNER_TEMP/mirrorpulse-cli-host-win-arm64"
            IntegrationPath = 'artifacts/evidence/cli-regression.json'
          }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $parameters.RequireInstalled = $true
            $parameters.InstalledPath = 'artifacts/evidence/installed.json'
          }
          ./eng/collect-ci-evidence.ps1 @parameters

      - name: Upload ARM64 verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-official-package-arm64
          path: artifacts/evidence/official-package-arm64.json
          if-no-files-found: error

  official-adapters:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore package verifier
        run: |
          pwsh ./eng/restore-adapter-sdk.ps1
          dotnet restore tests/MirrorPulse.Core.Tests/MirrorPulse.Core.Tests.csproj --locked-mode

      - name: Aggregate latest official Adapter releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pwsh ./eng/aggregate-official-adapters.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/artifacts/official-adapters"

      - name: Download previous signed Local Adapter release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $directory = "$env:GITHUB_WORKSPACE/artifacts/local-previous"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          gh release download v0.1.3 --repo MirrorPulse/adapter-local --dir $directory --pattern 'com.mirrorpulse.adapter.local-0.1.3.mpadapter*'
          if ($LASTEXITCODE -ne 0) { throw 'The previous signed Local Adapter release could not be downloaded.' }

      - name: Install SFTP fixture dependencies
        run: pwsh ./eng/setup-test-environment.ps1

      - name: Create local SMB test share
        shell: pwsh
        run: |
          $backing = Join-Path $env:RUNNER_TEMP 'mirrorpulse-smb-test'
          New-Item -ItemType Directory -Path $backing -Force | Out-Null
          New-SmbShare -Name MirrorPulseCiTest -Path $backing -FullAccess $env:USERNAME -ErrorAction Stop | Out-Null
          "MIRRORPULSE_SMB_TEST_SHARE=\\localhost\MirrorPulseCiTest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MIRRORPULSE_SMB_TEST_BACKING=$backing" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install every signed official Adapter with the production verifier
        env:
          MIRRORPULSE_OFFICIAL_AGGREGATE: ${{ github.workspace }}/artifacts/official-adapters
          MIRRORPULSE_LOCAL_PREVIOUS_RELEASE: ${{ github.workspace }}/artifacts/local-previous
        run: |
          dotnet test tests/MirrorPulse.Core.Tests/MirrorPulse.Core.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~OfficialAdapterAggregateProcessTests|FullyQualifiedName~SignedWebDavWorkerProcessTests|FullyQualifiedName~SignedLocalVersionSwitchProcessTests|FullyQualifiedName~SignedFtpReleaseReadsAndConditionallyUploadsThroughHostAndCfSharp|FullyQualifiedName~SignedSftpHostProcessTests|FullyQualifiedName~SignedSmbHostProcessTests" --logger trx --results-directory artifacts/test-results/official
          if ($LASTEXITCODE -ne 0) { throw 'Official Adapter tests failed.' }
          pwsh ./eng/verify-test-results.ps1 -Suite official -ResultsDirectory artifacts/test-results/official

      - name: Remove local SMB test share
        if: always()
        shell: pwsh
        run: |
          if (Get-SmbShare -Name MirrorPulseCiTest -ErrorAction SilentlyContinue) {
            Remove-SmbShare -Name MirrorPulseCiTest -Force
          }

      - name: Upload official Adapter aggregate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: official-adapters
          path: artifacts/official-adapters
          if-no-files-found: error

      - name: Collect official Adapter verification evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/evidence -Force | Out-Null
          ./eng/collect-ci-evidence.ps1 -Job official-adapters -Runtime win-x64 -OutputPath artifacts/evidence/official-adapters.json -TestManifests artifacts/test-results/official/test-evidence.json -AdapterDirectory artifacts/official-adapters

      - name: Upload official Adapter verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-official-adapters
          path: artifacts/evidence/official-adapters.json
          if-no-files-found: error
