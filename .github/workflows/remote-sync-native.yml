name: Remote sync native acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/remote-sync-native.yml
      - src/MirrorPulse.CloudFiles.CfSharp/MirrorPulseActiveRemotePoller*.cs
      - src/MirrorPulse.CloudFiles.CfSharp/MirrorPulseNamespaceDirectoryPublisher.cs
      - tests/MirrorPulse.CloudFiles.CfSharp.Tests/MirrorPulseWindowsNamespacePermissionLeaseTests.RuntimePopulation.cs

permissions:
  contents: read

jobs:
  protected-remote-sync-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Check out the selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore locked native test dependencies
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pwsh ./eng/restore-adapter-sdk.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Adapter SDK restore failed.' }
          dotnet restore tests/MirrorPulse.CloudFiles.CfSharp.Tests --locked-mode

      - name: Build the native test boundary
        run: dotnet build tests/MirrorPulse.CloudFiles.CfSharp.Tests -c Release --no-restore

      - name: Prepare the disposable native volume
        run: pwsh ./eng/prepare-native-ci-volume.ps1

      - name: Verify protected population and remote batch effects
        env:
          MIRRORPULSE_NAMESPACE_TEST_ARCHITECTURE: Arm64
        run: pwsh ./eng/verify-native.ps1 -RemoteSync

      - name: Preserve original test results and executing inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: remote-sync-native-arm64-originals
          path: artifacts/test-results/remote-sync/**
          if-no-files-found: warn
